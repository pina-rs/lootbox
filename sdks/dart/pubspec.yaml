name: lootbox
description: Ergonomic Dart SDK for the Pina lootbox primitive.
version: 0.0.2
repository: https://github.com/pina-rs/lootbox/tree/main/sdks/dart

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  lootbox_program_client:
    path: ../../clients/dart
  solana_kit_addresses: ">=0.10.0 <1.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
publish_to: none
