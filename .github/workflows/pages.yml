name: pages

# Publish the static Unlisted site (apps/web) to GitHub Pages at /lootbox/.
# Network settings come from repository variables so no rebuild of this file
# is needed to point the site at a new series:
#   VITE_SOLANA_CLUSTER  localnet | devnet | mainnet
#   VITE_RPC_URL         RPC endpoint for the cluster
#   VITE_TREASURY        locked series (template) address

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter @pina-rs/lootbox-playground...

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Refresh PreStocks price snapshot
        # Fail-soft: if the PreStocks API is down, keep the committed snapshot.
        # The site always shows the snapshot's capture date.
        working-directory: apps/web
        run: |
          if ! node tools/snapshot-prestocks.ts; then
            echo "::warning title=PreStocks snapshot::API unavailable; building with the committed price snapshot."
            git checkout -- src/launch/prestocks-snapshot.json public/logos/prestocks
          fi

      - name: Build site
        env:
          LOOTBOX_WEB_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SOLANA_CLUSTER: ${{ vars.VITE_SOLANA_CLUSTER }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_TREASURY: ${{ vars.VITE_TREASURY }}
        run: |
          pnpm --dir apps/web build
          # GitHub Pages serves 404.html for unknown paths, which keeps
          # client-side routes such as /playground working on reload.
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
