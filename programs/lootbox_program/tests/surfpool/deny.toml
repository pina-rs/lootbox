[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# Surfpool 1.6.1 was evaluated and rejected: its clock semantics break the
	# time-dependent journeys and it clears none of the advisories below.
	# Every ignored advisory roots in surfpool-core's bundled legacy stack
	# (reqwest 0.11, dalek 1/3, webpki 0.101, and unmaintained transitive
	# leaves); none ship in the on-chain program, SDKs, or web app. Re-evaluate
	# every ID on the next Surfpool release.
	# October 2026 wave: crypto-bigint timing variability and the unfixed
	# zstd 0.13 line, both inside Surfpool's bundled host-only stack.
	# chrono 0.4 is unmaintained and has no fixed release. It arrives through
	# Surfpool's diesel and Agave's solana-genesis-config, both host-only.
	# url 1.7.2 (RUSTSEC-2026-0592) is reachable only from this Surfpool test
	# harness (surfpool-types 1.7.0 and jsonrpc-client-transports 18.0.0 via
	# surfpool-core/surfpool-sdk/pina_test) and is not linked into
	# lootbox_program.so; url 2.x is updated to 2.5.9 across all lockfiles.
	{ id = "RUSTSEC-2026-0592", reason = "url 1.7.2 is reachable only from the Surfpool test harness (surfpool-types and jsonrpc-client-transports) and is not linked into lootbox_program.so" },
	"RUSTSEC-2026-0543",
	"RUSTSEC-2026-0387",
	"RUSTSEC-2026-0391",
	"RUSTSEC-2026-0398",
	"RUSTSEC-2026-0403",
	"RUSTSEC-2026-0410",
	"RUSTSEC-2020-0016",
	"RUSTSEC-2021-0139",
	"RUSTSEC-2022-0093",
	"RUSTSEC-2024-0344",
	"RUSTSEC-2024-0375",
	"RUSTSEC-2024-0384",
	"RUSTSEC-2024-0388",
	"RUSTSEC-2024-0421",
	"RUSTSEC-2024-0436",
	"RUSTSEC-2025-0141",
	"RUSTSEC-2025-0161",
	"RUSTSEC-2024-0449",
]

[bans]
# Agave/Surfpool intentionally spans several Solana compatibility generations.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
]
