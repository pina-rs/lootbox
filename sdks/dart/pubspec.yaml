name: lootbox
description: Ergonomic Dart SDK for the Pina lootbox primitive.
version: 0.0.1-alpha.0
repository: https://github.com/pina-rs/lootbox

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  solana_kit_addresses: ^0.8.0
  lootbox_program_generated: ^0.0.1-alpha.0

dependency_overrides:
  lootbox_program_generated:
    path: ../../programs/lootbox_program/clients/dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
