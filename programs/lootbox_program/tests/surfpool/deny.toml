[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# Surfpool 1.6.1 was evaluated and rejected: its clock semantics break the
	# time-dependent journeys and it clears none of the advisories below.
	# Every ignored advisory roots in surfpool-core's bundled legacy stack
	# (reqwest 0.11, dalek 1/3, webpki 0.101, and unmaintained transitive
	# leaves); none ship in the on-chain program, SDKs, or web app. Re-evaluate
	# every ID on the next Surfpool release.
	"RUSTSEC-2020-0016",
	"RUSTSEC-2021-0139",
	"RUSTSEC-2022-0093",
	"RUSTSEC-2024-0344",
	"RUSTSEC-2024-0375",
	"RUSTSEC-2024-0384",
	"RUSTSEC-2024-0388",
	"RUSTSEC-2024-0421",
	"RUSTSEC-2024-0436",
	"RUSTSEC-2025-0134",
	"RUSTSEC-2025-0141",
	"RUSTSEC-2025-0161",
	"RUSTSEC-2026-0098",
	"RUSTSEC-2026-0099",
	"RUSTSEC-2026-0104",
	"RUSTSEC-2026-0173",
	"RUSTSEC-2026-0258",
	"RUSTSEC-2024-0449",
	# rustls 0.21, rustls-webpki 0.101 and webpki-roots 0.25 arrive only through
	# txtx-addon-kit's reqwest 0.11 and have no patched release on those lines.
	"RUSTSEC-2026-0346",
	"RUSTSEC-2026-0349",
	"RUSTSEC-2026-0381",
	"RUSTSEC-2026-0382",
]

[bans]
# Agave/Surfpool intentionally spans several Solana compatibility generations.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
]
