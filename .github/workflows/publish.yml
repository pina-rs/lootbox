name: publish

# Publishes the release packages to crates.io with trusted publishing and
# flips the draft GitHub release created by release-pr.yml. release-pr.yml
# explicitly dispatches this workflow after creating the tag and draft release
# because a GITHUB_TOKEN tag push cannot trigger another workflow. Only the
# workflow on main may authorize a release; tags never select executable code.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0). Used by the automated release handoff and manual retries."
        required: true
        type: string
      release_sha:
        description: "Full SHA of the reviewed release commit on main. Must match the release tag and monochange release record."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  provenance:
    name: verify reviewed release provenance
    if: >-
      github.repository_owner == 'pina-rs' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.release_record.outputs.release_sha }}
    steps:
      - name: checkout trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: validate release revision
        env:
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::Publishing must be dispatched from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a release tag like v0.1.0." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full release commit SHA." >&2
            exit 1
          fi
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag does not match the approved commit." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_SHA" "$TRUSTED_MAIN_SHA"
        shell: bash

      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: install locked devenv
        run: |
          devenv_revision="$(
            nix eval --impure --raw --expr '
              let
                lock = builtins.fromJSON (builtins.readFile ./devenv.lock);
              in
                lock.nodes.devenv.locked.rev
            '
          )"
          nix profile add --accept-flake-config "github:cachix/devenv/${devenv_revision}#devenv"

      - name: validate approved release record
        id: release_record
        run: |
          set -euo pipefail
          release_record="$(monochange step release-record --from "$RELEASE_SHA" --format json)"
          jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
            .resolved_commit == $sha and .record_commit == $sha and
            (.record.release_targets | type) == "array" and
            any(.record.release_targets[]; .tag == true and .tag_name == $tag)
          ' <<< "$release_record"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

  publish:
    name: publish packages and release
    needs: provenance
    environment: publisher
    # The publisher environment must allow only the main branch, with no tags.
    permissions:
      contents: write # Publish the draft GitHub release after registry publication.
      id-token: write # Authenticate to crates.io trusted publishing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout approved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: install locked devenv
        run: |
          devenv_revision="$(
            nix eval --impure --raw --expr '
              let
                lock = builtins.fromJSON (builtins.readFile ./devenv.lock);
              in
                lock.nodes.devenv.locked.rev
            '
          )"
          nix profile add --accept-flake-config "github:cachix/devenv/${devenv_revision}#devenv"

      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc

      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
        run: |
          set -euo pipefail
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}

      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          set -euo pipefail
          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}

      - name: publish draft release
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag moved after provenance verification." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
