[graph]
all-features = true

[advisories]
# The October 2026 zstd wave lands unevenly across advisory databases;
# holds that a particular database snapshot does not trigger must not fail
# the check.
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# solana-client transitively depends on bincode 1.3.3, which is
	# flagged as unmaintained. Remove once solana-client upgrades.
	{ id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dependency of solana-client" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
	# The generated client still uses Solana's 3.x host API while Pina's
	# Pinocchio stack uses the 5.x syscall definitions on-chain.
	{ name = "solana-define-syscall", version = "4.0.1" },
	# Solana's host API uses syn 2 while Pina's current derive stack uses syn 3.
	{ name = "syn", version = "2.0.119" },
	# The lootbox-cli adds solana-client (4.x host API) which pulls in the
	# 3.x solana crate train alongside pina's 4.x pinocchio stack.
	{ name = "base64" },
	{ name = "block-buffer" },
	{ name = "combine" },
	{ name = "cpufeatures" },
	{ name = "crypto-common" },
	{ name = "darling" },
	{ name = "darling_core" },
	{ name = "darling_macro" },
	{ name = "digest" },
	# hashbrown 0.15 and 0.17 pin foldhash 0.1 and 0.2. The hashbrown copies
	# themselves stay because the Solana 3.x and 4.x trains have not met.
	{ name = "foldhash" },
	{ name = "getrandom" },
	{ name = "hashbrown" },
	{ name = "num-derive" },
	{ name = "r-efi" },
	{ name = "rand" },
	{ name = "rand_chacha" },
	{ name = "rand_core" },
	# Pina's ABI hashing pulls sha2 0.11 while spl-discriminator stays on 0.10.
	{ name = "sha2" },
	{ name = "solana-address" },
	{ name = "solana-instructions-sysvar" },
	{ name = "solana-pubkey" },
	# syn 2 (Solana host crates and asn1-rs) and syn 3 (Pina derives, yoke)
	# each pull their own synstructure.
	{ name = "synstructure" },
	{ name = "thiserror" },
	{ name = "thiserror-impl" },
	{ name = "webpki-roots" },
	# windows-sys 0.45 (jni, via rustls-platform-verifier) and 0.52 (ring)
	# each ship windows-targets and per-arch import libraries. windows-sys
	# 0.61 uses windows-link and does not add a third copy. These leaves are
	# Windows-only and do not link into the Linux or SBF build.
	{ name = "windows-sys" },
	{ name = "windows-targets" },
	{ name = "windows_aarch64_gnullvm" },
	{ name = "windows_aarch64_msvc" },
	{ name = "windows_i686_gnu" },
	{ name = "windows_i686_msvc" },
	{ name = "windows_x86_64_gnu" },
	{ name = "windows_x86_64_gnullvm" },
	{ name = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
]

# Permissive licenses used by the host-side dependency graph (CLI, test
# harnesses, generated clients). The on-chain program links none of these.
[licenses]
version = 2
allow = [
	"MIT",
	"MIT-0",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-1-Clause",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"0BSD",
	"Zlib",
	"MPL-2.0",
	"BSL-1.0",
	"Unicode-3.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"LGPL-2.1-or-later",
	"Unlicense",
]
