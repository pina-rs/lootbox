[package]
name = "lootbox_program-surfpool-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Keep Surfpool's host runtime dependency graph isolated from the program's
# native Mollusk tests and SBF build.
[workspace]

[lints]
workspace = true

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
	'cfg(coverage)',
	'cfg(target_os, values("solana"))',
	'cfg(target_arch, values("bpf"))',
	'cfg(target_feature, values("static-syscalls"))',
]

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"

[dependencies]
pina_test = "0.12.2"
program_under_test = { package = "lootbox_program", path = "../.." }
solana-commitment-config = "=3.1.1"
solana-message = "=4.4.1"
solana-rent = "=4.3.0"
solana-transaction = "=4.1.6"
spl-token-2022-interface = "=3.1.1"
spl-token-metadata-interface = "=1.0.1"
surfpool-sdk = "=1.5.0"
