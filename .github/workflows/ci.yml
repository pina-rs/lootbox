name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Install locked Devenv
        run: |
          devenv_revision="$(
            nix eval --impure --raw --expr '
              let
                lock = builtins.fromJSON (builtins.readFile ./devenv.lock);
              in
                lock.nodes.devenv.locked.rev
            '
          )"
          nix profile add --accept-flake-config "github:cachix/devenv/${devenv_revision}#devenv"

      - name: Install workspace dependencies
        run: |
          devenv shell -- pnpm install --frozen-lockfile
          devenv shell -- bash -lc 'cd sdks/dart && dart pub get --enforce-lockfile'
          devenv shell -- pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Verify program, SDKs, Surfpool, and playground
        run: devenv shell -- verify:all
