[package]
name = "lootbox_program"
version = "0.0.2"
edition.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/pina-rs/lootbox/tree/main/programs/lootbox_program"
description = "A fully collateralized random-reward primitive for Solana"

[lib]
# `cdylib` only. A second `lib` crate type makes rustc reject LTO for the
# program, which costs 20-35% of deployed program size. The Surfpool suite
# includes `src/lib.rs` by path instead of linking this crate, so no rlib is
# ever needed.
crate-type = ["cdylib"]

[features]
default = []
bpf-entrypoint = []

[dependencies]
pina = { workspace = true, features = ["account-resize", "logs", "token", "validation"] }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
switchboard_randomness_cpi = { workspace = true }

[dev-dependencies]
proptest.workspace = true
serde_json = "1"

[lints]
workspace = true
