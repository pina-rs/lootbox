[package]
name = "lootbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/pina-rs/lootbox/tree/main/crates/lootbox-cli"
description = "Command-line client for every lootbox program instruction"

[[bin]]
name = "lootbox"
path = "src/main.rs"

[lib]
name = "lootbox_cli"
path = "src/lib.rs"

[dependencies]
base64 = { default-features = false, version = "0.22" }
clap = { features = ["derive"], version = "4" }
lootbox-program-client = { workspace = true }
serde_json = { default-features = false, version = "1", features = ["std"] }
solana-client = { default-features = false, version = "4.2" }
solana-commitment-config = { default-features = false, version = "3.1" }
solana-instruction = { default-features = false, version = "3.4" }
solana-keypair = { default-features = false, version = "3.1" }
solana-program-error = { default-features = false, version = "3.0" }
solana-pubkey = { default-features = false, version = "4" }
solana-signer = { default-features = false, version = "3.0" }
solana-transaction = { default-features = false, version = "4.1" }
thiserror = { default-features = false, version = "2" }

[lints]
workspace = true
